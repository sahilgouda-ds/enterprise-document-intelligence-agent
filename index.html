<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Intelligence Agent</title>
<style>
  :root {
    --bg: #f5f6fa; --card: #ffffff; --text: #1c2030; --muted: #6b7280;
    --accent: #4f46e5; --accent-soft: #eef0ff; --border: #e4e7ee; --danger: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1016; --card: #171a23; --text: #e9ebf2; --muted: #98a1b3;
      --accent: #7c7ff5; --accent-soft: #222542; --border: #272b38; --danger: #ff8b7e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.55; }
  .app { max-width: 780px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 0 16px; }
  header { padding: 28px 0 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 12px;
    color: var(--muted); background: var(--card); border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
  .dot.ok { background: #22c55e; }
  .dot.bad { background: #ef4444; }
  main { flex: 1; padding: 8px 0 8px; }
  .welcome { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .welcome h2 { font-size: 16px; margin: 0 0 4px; }
  .welcome p { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: inherit; font-size: 13px; color: var(--accent); background: var(--accent-soft);
    border: 0; padding: 8px 12px; border-radius: 999px; cursor: pointer; text-align: left; }
  .chip:hover { filter: brightness(0.95); }
  .msg { margin-top: 18px; display: flex; flex-direction: column; scroll-margin-bottom: 120px; }
  .q { align-self: flex-end; max-width: 85%; background: var(--accent); color: #fff;
    padding: 10px 14px; border-radius: 16px 16px 4px 16px; font-size: 15px; }
  .a { align-self: flex-start; width: 100%; margin-top: 10px; background: var(--card);
    border: 1px solid var(--border); border-radius: 16px 16px 16px 4px; padding: 14px 16px; }
  .a p { margin: 0 0 8px; }
  .a p:last-child { margin-bottom: 0; }
  .err { color: var(--danger); }
  .typing span { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%;
    background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  details { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  .src { margin-top: 8px; font-size: 13px; color: var(--muted); background: var(--bg);
    border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; }
  .src b { color: var(--text); }
  footer { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 70%, transparent); padding: 12px 0 18px; }
  form { display: flex; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 8px; }
  input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 15px; padding: 8px 10px; }
  button.send { font: inherit; font-weight: 600; font-size: 14px; color: #fff; background: var(--accent);
    border: 0; border-radius: 12px; padding: 0 18px; cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: not-allowed; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Document Intelligence Agent</h1>
    <p class="sub">Ask questions about your company documents. Answers come only from the document.</p>
    <span class="badge"><span class="dot" id="dot"></span><span id="status">Connecting...</span></span>
  </header>

  <main id="thread">
    <section class="welcome" id="welcome">
      <h2>Try a question</h2>
      <p>Click one to get started, or type your own below.</p>
      <div class="chips" id="chips"></div>
    </section>
  </main>

  <footer>
    <form id="form">
      <input id="input" type="text" placeholder="Ask something about the document..." autocomplete="off" autofocus>
      <button class="send" id="send" type="submit">Ask</button>
    </form>
    <div class="hint">Answers are AI-generated from retrieved passages. Check the sources.</div>
  </footer>
</div>

<script>
  const examples = [
    "How many casual leaves do employees get?",
    "What is the hotel limit for a trip to Delhi?",
    "What is the notice period?",
    "Who do I contact for a laptop problem?",
    "What is the company's refund policy?"
  ];
  const thread = document.getElementById("thread");
  const welcome = document.getElementById("welcome");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  examples.forEach(function (text) {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.textContent = text;
    b.onclick = function () { ask(text); };
    document.getElementById("chips").appendChild(b);
  });

  fetch("/health").then(function (r) { return r.json(); }).then(function (d) {
    document.getElementById("dot").classList.add("ok");
    document.getElementById("status").textContent = "Ready · " + d.chunks + " sections indexed";
  }).catch(function () {
    document.getElementById("dot").classList.add("bad");
    document.getElementById("status").textContent = "Server not reachable";
  });

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function format(text) {
    return esc(text).split(/\n{2,}/).map(function (p) {
      return "<p>" + p.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>") + "</p>";
    }).join("");
  }

  async function ask(question) {
    question = question.trim();
    if (!question || sendBtn.disabled) return;
    welcome.style.display = "none";
    sendBtn.disabled = true;
    input.value = "";

    const msg = document.createElement("div");
    msg.className = "msg";
    const q = document.createElement("div");
    q.className = "q";
    q.textContent = question;
    const a = document.createElement("div");
    a.className = "a";
    a.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    msg.append(q, a);
    thread.appendChild(msg);
    msg.scrollIntoView({ behavior: "smooth", block: "end" });

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question })
      });
      if (!res.ok) throw new Error("Server error " + res.status);
      const data = await res.json();
      a.innerHTML = format(data.answer || "No answer returned.");
      if (data.sources && data.sources.length) {
        const d = document.createElement("details");
        d.innerHTML = "<summary>Sources (" + data.sources.length + ")</summary>" +
          data.sources.map(function (s, i) {
            return '<div class="src"><b>Passage ' + (i + 1) + "</b>\n" + esc(s) + "</div>";
          }).join("");
        a.appendChild(d);
      }
    } catch (err) {
      a.innerHTML = '<p class="err">Something went wrong. Please try again.</p>';
    }
    sendBtn.disabled = false;
    input.focus();
    msg.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    ask(input.value);
  });
</script>
</body>
</html>
